<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>粉肝身分證產生器</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --pink:#f9b8cc;--pink-light:#fde8ef;--pink-mid:#f272a0;
    --bg:#fff8fb;--panel:#fff;--border:#f0d0dd;
    --text:#3d1a2a;--text2:#8a5a6d;--text3:#c490a8;
    --accent:#f272a0;--accent2:#e95c96;
    --radius:10px;--shadow:0 2px 12px rgba(200,80,120,.10);
    --canvas-w:680px;--canvas-h:428px;
  }
  body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column;overflow:hidden;}
  /* Header */
  header{background:var(--panel);border-bottom:1.5px solid var(--border);padding:0 20px;height:52px;display:flex;align-items:center;gap:16px;flex-shrink:0;z-index:10;}
  header h1{font-size:17px;font-weight:700;color:var(--accent2);letter-spacing:.3px;display:flex;align-items:center;gap:8px;}
  header h1 span{font-size:22px;}
  .header-actions{margin-left:auto;display:flex;gap:8px;}
  .btn{padding:6px 14px;border-radius:8px;border:1.5px solid var(--border);background:var(--panel);color:var(--text);font-size:13px;font-weight:500;cursor:pointer;display:flex;align-items:center;gap:6px;transition:all .15s;}
  .btn:hover{background:var(--pink-light);border-color:var(--pink-mid);}
  .btn.primary{background:var(--accent);border-color:var(--accent2);color:#fff;}
  .btn.primary:hover{background:var(--accent2);}
  /* Layout */
  .app{flex:1;display:flex;overflow:hidden;}
  /* Left panel */
  .left{width:220px;flex-shrink:0;background:var(--panel);border-right:1.5px solid var(--border);display:flex;flex-direction:column;overflow:hidden;}
  .panel-tabs{display:flex;border-bottom:1.5px solid var(--border);flex-shrink:0;}
  .tab{flex:1;padding:10px 4px;font-size:12px;font-weight:600;text-align:center;cursor:pointer;color:var(--text2);border-bottom:2px solid transparent;transition:all .15s;}
  .tab.active{color:var(--accent2);border-bottom-color:var(--accent2);}
  .panel-body{flex:1;overflow-y:auto;padding:12px;}
  /* Section */
  .section-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--text3);margin:12px 0 8px;}
  /* Upload area */
  .upload-zone{border:2px dashed var(--border);border-radius:var(--radius);padding:16px;text-align:center;cursor:pointer;transition:all .15s;background:var(--pink-light);}
  .upload-zone:hover{border-color:var(--accent);background:#fde0ea;}
  .upload-zone p{font-size:12px;color:var(--text2);margin-top:6px;}
  .upload-zone .icon{font-size:28px;}
  /* Font list */
  .font-item{padding:8px 10px;border-radius:7px;cursor:pointer;font-size:13px;border:1.5px solid transparent;transition:all .12s;margin-bottom:4px;display:flex;justify-content:space-between;align-items:center;}
  .font-item:hover{background:var(--pink-light);border-color:var(--border);}
  .font-item.active{background:var(--pink-light);border-color:var(--accent);}
  /* Layer list */
  .layer-item{display:flex;align-items:center;gap:6px;padding:7px 8px;border-radius:7px;cursor:pointer;font-size:12px;border:1.5px solid transparent;transition:all .12s;margin-bottom:3px;}
  .layer-item:hover{background:var(--pink-light);}
  .layer-item.active{background:var(--pink-light);border-color:var(--accent);}
  .layer-drag{cursor:grab;color:var(--text3);font-size:14px;}
  .layer-name{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .layer-icon{font-size:13px;cursor:pointer;color:var(--text3);padding:2px;}
  .layer-icon:hover{color:var(--accent2);}
  .layer-type-badge{font-size:10px;padding:1px 5px;border-radius:4px;background:var(--pink-light);color:var(--text2);}
  /* Center canvas area */
  .center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:auto;padding:24px;gap:12px;}
  .canvas-wrapper{position:relative;box-shadow:0 4px 32px rgba(200,80,120,.18);border-radius:14px;overflow:hidden;}
  #main-canvas{display:block;}
  .canvas-size-bar{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text2);}
  .canvas-size-bar input{width:64px;padding:4px 8px;border:1.5px solid var(--border);border-radius:6px;font-size:12px;color:var(--text);}
  /* Right panel */
  .right{width:240px;flex-shrink:0;background:var(--panel);border-left:1.5px solid var(--border);display:flex;flex-direction:column;overflow:hidden;}
  .right-body{flex:1;overflow-y:auto;padding:14px;}
  .prop-row{margin-bottom:12px;}
  .prop-label{font-size:11px;font-weight:600;color:var(--text2);margin-bottom:4px;display:flex;justify-content:space-between;}
  .prop-input{width:100%;padding:6px 10px;border:1.5px solid var(--border);border-radius:7px;font-size:13px;color:var(--text);background:var(--bg);}
  .prop-input:focus{outline:none;border-color:var(--accent);}
  .prop-row-2{display:flex;gap:8px;}
  .prop-row-2 .prop-row{flex:1;margin-bottom:0;}
  .color-row{display:flex;align-items:center;gap:8px;}
  .color-picker{width:36px;height:32px;border:1.5px solid var(--border);border-radius:7px;cursor:pointer;padding:2px;}
  .bold-btn{padding:5px 10px;border-radius:6px;border:1.5px solid var(--border);font-weight:700;font-size:13px;cursor:pointer;background:var(--bg);}
  .bold-btn.active{background:var(--pink-light);border-color:var(--accent);}
  .align-btns{display:flex;gap:4px;}
  .align-btn{flex:1;padding:5px;border:1.5px solid var(--border);border-radius:6px;font-size:14px;cursor:pointer;background:var(--bg);text-align:center;transition:all .12s;}
  .align-btn.active,.align-btn:hover{background:var(--pink-light);border-color:var(--accent);}
  .empty-state{text-align:center;padding:24px 12px;color:var(--text3);font-size:13px;}
  .empty-state .icon{font-size:32px;margin-bottom:8px;}
  /* Quick action bar */
  .quick-bar{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:10px;}
  .quick-btn{padding:5px 10px;border-radius:6px;border:1.5px solid var(--border);font-size:12px;cursor:pointer;background:var(--bg);transition:all .12s;}
  .quick-btn:hover{background:var(--pink-light);border-color:var(--accent);}
  /* Scrollbar */
  ::-webkit-scrollbar{width:5px;height:5px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}
  /* Toast */
  #toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#3d1a2a;color:#fff;padding:8px 20px;border-radius:10px;font-size:13px;z-index:9999;opacity:0;transition:opacity .3s;pointer-events:none;}
  #toast.show{opacity:1;}
  select.prop-input{appearance:auto;}
  
</style>
</head>
<body>

<header>
  <h1><span>🐶</span> 粉肝身分證產生器</h1>
  <div class="header-actions">
    <button class="btn" onclick="doUndo()">↩ 上一步</button>
    <button class="btn" onclick="doRedo()">↪ 下一步</button>
    <button class="btn" onclick="exportPNG()">⬇ 匯出 PNG</button>
    <button class="btn primary" onclick="exportJPG()">⬇ 匯出 JPG</button>
  </div>
</header>

<div class="app">
  <!-- Left Panel -->
  <div class="left">
    <div class="panel-tabs">
      <div class="tab active" onclick="switchTab('upload',this)">圖片</div>
      <div class="tab" onclick="switchTab('text',this)">文字</div>
      <div class="tab" onclick="switchTab('font',this)">字體</div>
      <div class="tab" onclick="switchTab('layer',this)">圖層</div>
    </div>
    <div class="panel-body">
      <!-- Upload tab -->
      <div id="tab-upload">
        <p class="section-title">底圖設定</p>
        <div class="upload-zone" onclick="document.getElementById('bg-upload').click()">
          <div class="icon">🖼</div>
          <p>點擊上傳底圖</p>
          <p style="font-size:11px;margin-top:2px">PNG / JPG</p>
        </div>
        <input id="bg-upload" type="file" accept="image/*" style="display:none" onchange="handleBgUpload(this)"/>
        
        <p class="section-title" style="margin-top:16px">插入圖片</p>
        <div class="upload-zone" onclick="document.getElementById('img-upload').click()">
          <div class="icon">📎</div>
          <p>點擊插入圖片</p>
        </div>
        <input id="img-upload" type="file" accept="image/*" style="display:none" onchange="handleImgUpload(this)"/>

        <p class="section-title" style="margin-top:16px">畫布尺寸</p>
        <div class="prop-row-2">
          <div class="prop-row">
            <div class="prop-label">寬 (px)</div>
            <input class="prop-input" id="canvas-w" type="number" value="680" onchange="resizeCanvas()"/>
          </div>
          <div class="prop-row">
            <div class="prop-label">高 (px)</div>
            <input class="prop-input" id="canvas-h" type="number" value="428" onchange="resizeCanvas()"/>
          </div>
        </div>
        <button class="btn" style="width:100%;margin-top:8px;justify-content:center" onclick="resizeCanvas()">套用尺寸</button>
        <button class="btn" style="width:100%;margin-top:6px;justify-content:center" onclick="loadDefaultBg()">🐶 載入預設底圖</button>
      </div>

      <!-- Text tab -->
      <div id="tab-text" style="display:none">
        <p class="section-title">新增文字</p>
        <button class="btn" style="width:100%;justify-content:center;margin-bottom:8px" onclick="addText()">＋ 新增文字框</button>
        <button class="btn" style="width:100%;justify-content:center" onclick="addText('副標題')">＋ 新增副標題</button>
        
        <p class="section-title" style="margin-top:16px">常用文字</p>
        <div style="display:flex;flex-direction:column;gap:4px">
          <button class="quick-btn" style="text-align:left" onclick="addTextContent('姓名：')">姓名欄位</button>
          <button class="quick-btn" style="text-align:left" onclick="addTextContent('生日：')">生日欄位</button>
          <button class="quick-btn" style="text-align:left" onclick="addTextContent('身分證字號：')">身分證字號</button>
          <button class="quick-btn" style="text-align:left" onclick="addTextContent('地址：')">地址欄位</button>
        </div>
      </div>

      <!-- Font tab -->
      <div id="tab-font" style="display:none">
        <p class="section-title">內建字體</p>
        <div id="font-list"></div>
        <p class="section-title" style="margin-top:14px">上傳字體</p>
        <div class="upload-zone" onclick="document.getElementById('font-upload').click()">
          <div class="icon">🔤</div>
          <p>TTF / OTF / WOFF</p>
        </div>
        <input id="font-upload" type="file" accept=".ttf,.otf,.woff,.woff2" style="display:none" onchange="handleFontUpload(this)"/>
        <div id="custom-font-list" style="margin-top:8px"></div>
      </div>

      <!-- Layer tab -->
      <div id="tab-layer" style="display:none">
        <p class="section-title">圖層列表</p>
        <div style="margin-bottom:8px;display:flex;gap:4px">
          <button class="quick-btn" onclick="groupSelected()">群組</button>
          <button class="quick-btn" onclick="ungroupSelected()">取消群組</button>
        </div>
        <div id="layer-list"></div>
      </div>
    </div>
  </div>

  <!-- Canvas -->
  <div class="center">
    <div class="canvas-wrapper" id="canvas-wrapper">
      <canvas id="main-canvas"></canvas>
    </div>
  </div>

  <!-- Right Panel -->
  <div class="right">
    <div style="padding:12px 14px;border-bottom:1.5px solid var(--border);font-size:13px;font-weight:600;color:var(--text2)">屬性設定</div>
    <div class="right-body" id="right-panel">
      <div class="empty-state">
        <div class="icon">👆</div>
        <p>選取元素<br/>以編輯屬性</p>
      </div>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
// ===================== CANVAS SETUP =====================
let canvas, history=[], histIndex=-1, currentFont='serif', selectedObj=null;
const FONTS=[
  {name:'壱城ラウラfont',css:'fontTest'},
  {name:'思源黑體',css:'Noto Sans TC,sans-serif'},
  {name:'思源宋體',css:'Noto Serif TC,serif'},
  {name:'Arial',css:'Arial,sans-serif'},
  {name:'Georgia',css:'Georgia,serif'},
  {name:'Courier New',css:'Courier New,monospace'},
];

const fontTest = new FontFace('fontTest', 'url(public/custom_font.otf)', {
  style: 'normal',
  weight: 'normal',
});
const CUSTOM_FONTS=[];



window.onload=()=>{
  Promise.all([
    fontTest.load(),
  ]).then(() => {
    // add the css to the document for those loaded fonts
    document.fonts.add(fontTest);
	canvas=new fabric.Canvas('main-canvas',{
		width:680,height:428,
		backgroundColor:'#fef9f5',
		preserveObjectStacking:true
	  });
	  buildFontList();
	  loadDefaultBg();
	  canvas.on('object:added',()=>{ refreshLayers(); saveHistory(); });
	  canvas.on('object:removed',()=>{ refreshLayers(); saveHistory(); });
	  canvas.on('object:modified',()=>{ refreshLayers(); saveHistory(); });
	  canvas.on('selection:created',onSelect);
	  canvas.on('selection:updated',onSelect);
	  canvas.on('selection:cleared',()=>{ selectedObj=null; renderRightPanel(null); });
	  setupKeyboard();
  });
  
};

function addDefaultTextObjects(){
  _ignoreHistory=true;

  // Helper: create an IText and add it
  function T(text, left, top, opts){
    const nm=(opts&&opts._name)||text;
    const rest=Object.assign({},opts); delete rest._name;
    const o=new fabric.IText(text, Object.assign({
      fontFamily:'fontTest',
      fontSize:20, fill:'#3a2010', selectable:false
    }, rest, {left, top}));
    o._layerName=nm;
    canvas.add(o);
    return o;
  }

  // ── Title ───────────────────────────────────────────
  T('粉肝村邁民身分證', 168, 74, {
    fontSize:36, fontWeight:'bold',fontFamily:'fontTest', fill:'#3a2010', _name:'標題', selectable:false,

  photo._layerName='照片粘貼處';
  canvas.add(photo);

  // ── 姓名 填寫區 (editable blank) ────────────────────

  // ── 出生年月日 label (two-line compact) ─────────────

  canvas.add(dob);

function roundRect(ctx,x,y,w,h,r){
  ctx.moveTo(x+r,y);
  ctx.lineTo(x+w-r,y);
  ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r);
  ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h);
  ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r);
  ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();
}

function drawDogFace(ctx,cx,cy,r){
  // Face
  ctx.fillStyle='#f2b3b3';
  ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.fill();
  // Ears
  ctx.beginPath(); ctx.ellipse(cx-r*.7,cy-r*.4,r*.45,r*.55,-.3,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(cx+r*.7,cy-r*.4,r*.45,r*.55,.3,0,Math.PI*2); ctx.fill();
  // Eyes
  ctx.fillStyle='#6b2d3e';
  ctx.beginPath(); ctx.arc(cx-r*.3,cy-r*.1,r*.1,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(cx+r*.3,cy-r*.1,r*.1,0,Math.PI*2); ctx.fill();
  // Nose
  ctx.fillStyle='#c05070';
  ctx.beginPath(); ctx.ellipse(cx,cy+r*.2,r*.12,r*.08,0,0,Math.PI*2); ctx.fill();
  // Outline
  ctx.strokeStyle='#c08090';ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.stroke();
}

// ===================== UPLOAD =====================
function handleBgUpload(input){
  const file=input.files[0]; if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{
    fabric.Image.fromURL(e.target.result,img=>{
      const scaleX=canvas.width/img.width;
      const scaleY=canvas.height/img.height;
      canvas.setBackgroundImage(img,canvas.renderAll.bind(canvas),{scaleX,scaleY});
      saveHistory(); toast('底圖已更新');
    });
  };
  reader.readAsDataURL(file);
  input.value='';
}

function handleImgUpload(input){
  const file=input.files[0]; if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{
    fabric.Image.fromURL(e.target.result,img=>{
      img.set({left:80,top:80,scaleX:.5,scaleY:.5});
      img._layerName='圖片';
      canvas.add(img); canvas.setActiveObject(img); canvas.renderAll();
      toast('圖片已插入');
    });
  };
  reader.readAsDataURL(file);
  input.value='';
}

// ===================== TEXT =====================
function addText(content){
  const t=new fabric.IText(content||'輸入文字',{
    left:100,top:160,
    fontFamily:currentFont,
    fontSize:28,
    fill:'#3d1a2a',
    fontWeight:'normal',
  });

function addTextContent(c){ addText(c); }

// ===================== FONT =====================
function buildFontList(){
  const el=document.getElementById('font-list');
  el.innerHTML='';
  FONTS.forEach(f=>{
    const div=document.createElement('div');
    div.className='font-item'+(f.css===currentFont?' active':'');
    div.style.fontFamily=f.css;
    div.innerHTML=`<span>${f.name}</span><span style="font-size:11px;color:var(--text3)">Aa</span>`;
    div.onclick=()=>{ applyFont(f.css); buildFontList(); };
    el.appendChild(div);
  });
}

function applyFont(css){
  currentFont=css;
  const obj=canvas.getActiveObject();
  if(obj&&(obj.type==='i-text'||obj.type==='text')){
    obj.set('fontFamily',css); canvas.renderAll(); saveHistory();
  }
  buildFontList();
  renderRightPanel(canvas.getActiveObject());
}

function handleFontUpload(input){
  const file=input.files[0]; if(!file)return;
  const name=file.name.replace(/\.[^.]+$/,'');
  const reader=new FileReader();
  reader.onload=e=>{
    const style=document.createElement('style');
    style.innerHTML=`@font-face{font-family:'${name}';src:url('${e.target.result}');}`;
    document.head.appendChild(style);
    const entry={name,css:`'${name}',sans-serif`};
    CUSTOM_FONTS.push(entry);
    buildCustomFontList();
    toast(`字體 "${name}" 已上傳`);
  };
  reader.readAsDataURL(file);
  input.value='';
}

function buildCustomFontList(){
  const el=document.getElementById('custom-font-list');
  el.innerHTML='';
  CUSTOM_FONTS.forEach(f=>{
    const div=document.createElement('div');
    div.className='font-item';
    div.style.fontFamily=f.css;
    div.innerHTML=`<span>${f.name}</span><span style="font-size:11px;color:var(--accent)">自訂</span>`;
    div.onclick=()=>applyFont(f.css);
    el.appendChild(div);
  });
}

// ===================== LAYERS =====================
function refreshLayers(){
  const el=document.getElementById('layer-list');
  const objs=[...canvas.getObjects()].reverse();
  el.innerHTML='';
  if(objs.length===0){el.innerHTML='<div style="color:var(--text3);font-size:12px;padding:8px">尚無圖層</div>';return;}
  objs.forEach((obj,i)=>{
    const realIdx=objs.length-1-i;
    const div=document.createElement('div');
    div.className='layer-item'+(canvas.getActiveObject()===obj?' active':'');
    const isHidden=obj.visible===false;
    const isLocked=obj.lockMovementX&&obj.lockMovementY;
    const typeName=obj.type==='i-text'?'文':'圖';
    div.innerHTML=`
      <span class="layer-drag">⠿</span>
      <span class="layer-type-badge">${typeName}</span>
      <span class="layer-name">${obj._layerName||obj.type||'元素'}</span>
      <span class="layer-icon" title="${isHidden?'顯示':'隱藏'}" onclick="toggleVisible(${realIdx},event)">${isHidden?'🙈':'👁'}</span>
      <span class="layer-icon" title="${isLocked?'解鎖':'鎖定'}" onclick="toggleLock(${realIdx},event)">${isLocked?'🔒':'🔓'}</span>
    `;
    div.onclick=()=>{ canvas.setActiveObject(obj); canvas.renderAll(); refreshLayers(); };
    el.appendChild(div);
  });
}

function toggleVisible(idx,e){
  e.stopPropagation();
  const obj=canvas.item(idx);
  obj.visible=!obj.visible;
  canvas.renderAll(); refreshLayers();
}

function toggleLock(idx,e){
  e.stopPropagation();
  const obj=canvas.item(idx);
  const locked=obj.lockMovementX;
  obj.set({lockMovementX:!locked,lockMovementY:!locked,lockRotation:!locked,lockScalingX:!locked,lockScalingY:!locked,selectable:locked});
  canvas.renderAll(); refreshLayers();
}

// ===================== GROUP =====================
function groupSelected(){
  const sel=canvas.getActiveObject();
  if(!sel||sel.type!=='activeSelection'){toast('請先多選元素');return;}
  sel.toGroup();
  canvas.renderAll(); refreshLayers(); saveHistory(); toast('已群組');
}
function ungroupSelected(){
  const sel=canvas.getActiveObject();
  if(!sel||sel.type!=='group'){toast('請選取群組');return;}
  sel.toActiveSelection();
  canvas.renderAll(); refreshLayers(); saveHistory(); toast('已取消群組');
}

// ===================== SELECTION / RIGHT PANEL =====================
function onSelect(e){
  selectedObj=canvas.getActiveObject();
  renderRightPanel(selectedObj);
  refreshLayers();
}

function renderRightPanel(obj){
  const el=document.getElementById('right-panel');
  if(!obj){
    el.innerHTML='<div class="empty-state"><div class="icon">👆</div><p>選取元素<br/>以編輯屬性</p></div>';

  const isText=obj.type==='i-text'||obj.type==='text';
  let html=`
    <div class="quick-bar">
      <button class="quick-btn" onclick="bringFront()">置頂</button>
      <button class="quick-btn" onclick="sendBack()">置底</button>
      <button class="quick-btn" onclick="cloneObj()">複製</button>
      <button class="quick-btn" onclick="deleteObj()">刪除</button>
    </div>
    <div class="prop-row">
      <div class="prop-label">圖層名稱</div>
      <input class="prop-input" value="${obj._layerName||''}" onchange="setLayerName(this.value)" placeholder="命名圖層..."/>
    </div>
    <div class="prop-row-2">
      <div class="prop-row">
        <div class="prop-label">X</div>
        <input class="prop-input" type="number" value="${Math.round(obj.left)}" onchange="obj.set('left',+this.value);canvas.renderAll();saveHistory()"/>
      </div>
      <div class="prop-row">
        <div class="prop-label">Y</div>
        <input class="prop-input" type="number" value="${Math.round(obj.top)}" onchange="obj.set('top',+this.value);canvas.renderAll();saveHistory()"/>
      </div>
    </div>
    <div class="prop-row-2">
      <div class="prop-row">
        <div class="prop-label">寬</div>
        <input class="prop-input" type="number" value="${Math.round(obj.getScaledWidth())}" onchange="setWidth(+this.value)"/>
      </div>
      <div class="prop-row">
        <div class="prop-label">高</div>
        <input class="prop-input" type="number" value="${Math.round(obj.getScaledHeight())}" onchange="setHeight(+this.value)"/>
      </div>
    </div>
    <div class="prop-row">
      <div class="prop-label">旋轉 (°)</div>
      <input class="prop-input" type="number" value="${Math.round(obj.angle)}" onchange="obj.set('angle',+this.value);canvas.renderAll();saveHistory()"/>
    </div>
    <div class="prop-row">
      <div class="prop-label">透明度</div>
      <input class="prop-input" type="range" min="0" max="1" step="0.01" value="${obj.opacity}" oninput="obj.set('opacity',+this.value);canvas.renderAll();saveHistory()"/>
    </div>
  `;
  if(isText){
    html+=`
      <hr style="border:none;border-top:1px solid var(--border);margin:10px 0"/>
      <div class="prop-row">
        <div class="prop-label">字體</div>
        <select class="prop-input" onchange="obj.set('fontFamily',this.value);canvas.renderAll();saveHistory()">
          ${FONTS.map(f=>`<option value="${f.css}" ${obj.fontFamily===f.css?'selected':''}>${f.name}</option>`).join('')}
          ${CUSTOM_FONTS.map(f=>`<option value="${f.css}" ${obj.fontFamily===f.css?'selected':''}>${f.name}（自訂）</option>`).join('')}
        </select>
      </div>
      <div class="prop-row-2">
        <div class="prop-row">
          <div class="prop-label">大小</div>
          <input class="prop-input" type="number" value="${obj.fontSize}" onchange="obj.set('fontSize',+this.value);canvas.renderAll();saveHistory()"/>
        </div>
        <div class="prop-row">
          <div class="prop-label">字距</div>
          <input class="prop-input" type="number" value="${obj.charSpacing||0}" onchange="obj.set('charSpacing',+this.value);canvas.renderAll();saveHistory()"/>
        </div>
      </div>
      <div class="prop-row">
        <div class="prop-label">行高</div>
        <input class="prop-input" type="number" step="0.1" value="${obj.lineHeight||1.16}" onchange="obj.set('lineHeight',+this.value);canvas.renderAll();saveHistory()"/>
      </div>
      <div class="prop-row">
        <div class="prop-label">顏色</div>
        <div class="color-row">
          <input type="color" class="color-picker" value="${rgbToHex(obj.fill)||'#3d1a2a'}" oninput="obj.set('fill',this.value);canvas.renderAll();saveHistory()"/>
          <input class="prop-input" value="${obj.fill||'#3d1a2a'}" onchange="obj.set('fill',this.value);canvas.renderAll();saveHistory()" style="flex:1"/>
        </div>
      </div>
      <div class="prop-row">
        <div class="prop-label">樣式</div>
        <div style="display:flex;gap:6px">
          <button class="bold-btn ${obj.fontWeight==='bold'?'active':''}" onclick="toggleBold(this)">B</button>
          <button class="bold-btn ${obj.fontStyle==='italic'?'active':''}" style="font-style:italic" onclick="toggleItalic(this)">I</button>
          <button class="bold-btn ${obj.underline?'active':''}" style="text-decoration:underline" onclick="toggleUnderline(this)">U</button>
        </div>
      </div>
      <div class="prop-row">
        <div class="prop-label">對齊</div>
        <div class="align-btns">
          <button class="align-btn ${obj.textAlign==='left'?'active':''}" onclick="setAlign('left',this)">⬅</button>
          <button class="align-btn ${obj.textAlign==='center'?'active':''}" onclick="setAlign('center',this)">⬜</button>
          <button class="align-btn ${obj.textAlign==='right'?'active':''}" onclick="setAlign('right',this)">➡</button>
        </div>
      </div>
    `;
  }
  el.innerHTML=html;
  // Re-bind obj reference for closures
  const inputs=el.querySelectorAll('input,select');
  inputs.forEach(inp=>{
    inp._obj=obj;
  });
}

function setLayerName(v){
  const obj=canvas.getActiveObject(); if(!obj)return;
  obj._layerName=v; refreshLayers();
}
function setWidth(v){
  const obj=canvas.getActiveObject(); if(!obj)return;
  obj.set('scaleX',v/obj.width); canvas.renderAll(); saveHistory();
}
function setHeight(v){
  const obj=canvas.getActiveObject(); if(!obj)return;
  obj.set('scaleY',v/obj.height); canvas.renderAll(); saveHistory();
}
function bringFront(){const o=canvas.getActiveObject();if(o){canvas.bringToFront(o);canvas.renderAll();refreshLayers();}}
function sendBack(){const o=canvas.getActiveObject();if(o){canvas.sendToBack(o);canvas.renderAll();refreshLayers();}}
function cloneObj(){
  const o=canvas.getActiveObject(); if(!o)return;
  o.clone(cloned=>{cloned.set({left:o.left+20,top:o.top+20});canvas.add(cloned);canvas.setActiveObject(cloned);canvas.renderAll();});
}
function deleteObj(){const o=canvas.getActiveObject();if(o){canvas.remove(o);canvas.renderAll();}}

function toggleBold(btn){
  const obj=canvas.getActiveObject(); if(!obj)return;
  const b=obj.fontWeight==='bold'?'normal':'bold';
  obj.set('fontWeight',b); canvas.renderAll(); saveHistory();
  btn.classList.toggle('active');
}
function toggleItalic(btn){
  const obj=canvas.getActiveObject(); if(!obj)return;
  const i=obj.fontStyle==='italic'?'normal':'italic';
  obj.set('fontStyle',i); canvas.renderAll(); saveHistory();
  btn.classList.toggle('active');
}
function toggleUnderline(btn){
  const obj=canvas.getActiveObject(); if(!obj)return;
  obj.set('underline',!obj.underline); canvas.renderAll(); saveHistory();
  btn.classList.toggle('active');
}
function setAlign(a,btn){
  const obj=canvas.getActiveObject(); if(!obj)return;
  obj.set('textAlign',a); canvas.renderAll(); saveHistory();
  document.querySelectorAll('.align-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
}

// ===================== TABS =====================
function switchTab(name,el){
  document.querySelectorAll('[id^="tab-"]').forEach(t=>t.style.display='none');
  document.getElementById('tab-'+name).style.display='';
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  if(name==='layer')refreshLayers();
}

// ===================== CANVAS RESIZE =====================
function resizeCanvas(){
  const w=+document.getElementById('canvas-w').value||680;
  const h=+document.getElementById('canvas-h').value||428;
  canvas.setWidth(w); canvas.setHeight(h); canvas.renderAll();
}

// ===================== HISTORY =====================
function saveHistory(){
  const json=JSON.stringify(canvas.toJSON(['_layerName']));
  if(histIndex<history.length-1)history=history.slice(0,histIndex+1);
  history.push(json); histIndex=history.length-1;
  if(history.length>50){history.shift();histIndex--;}
}
function doUndo(){
  if(histIndex<=0)return;
  histIndex--;
  canvas.loadFromJSON(history[histIndex],()=>canvas.renderAll());
}
function doRedo(){
  if(histIndex>=history.length-1)return;
  histIndex++;
  canvas.loadFromJSON(history[histIndex],()=>canvas.renderAll());
}

// ===================== EXPORT =====================
function exportPNG(){
  const dataURL=canvas.toDataURL({format:'png',multiplier:2});
  download(dataURL,'id-card.png');
  toast('PNG 已匯出');

function exportJPG(){
  const dataURL=canvas.toDataURL({format:'jpeg',quality:.95,multiplier:2});
  download(dataURL,'id-card.jpg');
  toast('JPG 已匯出');
}
function download(url,name){
  const a=document.createElement('a'); a.href=url; a.download=name; a.click();
}

// ===================== KEYBOARD =====================
function setupKeyboard(){
  document.addEventListener('keydown',e=>{
    if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA'||e.target.isContentEditable)return;
    const ctrl=e.ctrlKey||e.metaKey;
    if(ctrl&&e.key==='z'){e.preventDefault();doUndo();}
    if(ctrl&&(e.key==='y'||(e.shiftKey&&e.key==='z'))){e.preventDefault();doRedo();}
    if(ctrl&&e.key==='c'){canvas.getActiveObject()&&canvas.getActiveObject().clone(c=>{window._clipboard=c;});}
    if(ctrl&&e.key==='v'&&window._clipboard){
      window._clipboard.clone(c=>{c.set({left:c.left+20,top:c.top+20});canvas.add(c);canvas.setActiveObject(c);canvas.renderAll();});
    }
    if(ctrl&&e.key==='x'){const o=canvas.getActiveObject();if(o){o.clone(c=>{window._clipboard=c;});canvas.remove(o);canvas.renderAll();}}
    if(ctrl&&e.key==='g'){e.preventDefault();groupSelected();}
    if((e.key==='Delete'||e.key==='Backspace')&&canvas.getActiveObject()){
      canvas.remove(canvas.getActiveObject()); canvas.renderAll();
    }
  });
}

// ===================== RIGHT CLICK MENU =====================
canvas&&canvas.on('mouse:down',function(opt){
  if(opt.button===3||(opt.e&&opt.e.button===2)){
    opt.e.preventDefault();
    showContextMenu(opt.e.clientX,opt.e.clientY);
  }
});

document.addEventListener('contextmenu',e=>{
  const wrapper=document.getElementById('canvas-wrapper');
  if(wrapper&&wrapper.contains(e.target)){
    e.preventDefault();
    showContextMenu(e.clientX,e.clientY);
  }
});

let ctxMenu=null;
function showContextMenu(x,y){
  removeContextMenu();
  const obj=canvas&&canvas.getActiveObject();
  const menu=document.createElement('div');
  menu.id='ctx-menu';
  menu.style.cssText=`position:fixed;top:${y}px;left:${x}px;background:var(--panel);border:1.5px solid var(--border);border-radius:10px;box-shadow:0 4px 20px rgba(0,0,0,.12);z-index:9999;min-width:150px;padding:6px;`;
  const items=[
    ['複製',()=>cloneObj()],
    ['刪除',()=>deleteObj()],
    ['---'],
    ['置頂',()=>bringFront()],
    ['置底',()=>sendBack()],
    ['---'],
    ['群組 (Ctrl+G)',()=>groupSelected()],
    ['取消群組',()=>ungroupSelected()],
    ['---'],
    ['上一步',()=>doUndo()],
    ['下一步',()=>doRedo()],
  ];
  items.forEach(([label,fn])=>{
    if(label==='---'){
      const d=document.createElement('div');
      d.style.cssText='border-top:1px solid var(--border);margin:4px 0';
      menu.appendChild(d); return;
    }
    const b=document.createElement('button');
    b.textContent=label;
    b.style.cssText='display:block;width:100%;text-align:left;padding:7px 12px;background:none;border:none;border-radius:6px;font-size:13px;cursor:pointer;color:var(--text)';
    b.onmouseenter=()=>b.style.background='var(--pink-light)';
    b.onmouseleave=()=>b.style.background='none';
    b.onclick=()=>{ fn(); removeContextMenu(); };
    if(!obj&&['複製','刪除','置頂','置底','群組 (Ctrl+G)','取消群組'].includes(label)){
      b.style.opacity='.4'; b.onclick=()=>removeContextMenu();
    }
    menu.appendChild(b);
  });
  document.body.appendChild(menu);
  ctxMenu=menu;
  setTimeout(()=>document.addEventListener('click',removeContextMenu,{once:true}),0);
}
function removeContextMenu(){
  if(ctxMenu){ctxMenu.remove();ctxMenu=null;}
}

// ===================== UTILS =====================
function rgbToHex(color){
  if(!color)return'#3d1a2a';
  if(color.startsWith('#'))return color;
  return color;
}
function toast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg; el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'),2200);
}
